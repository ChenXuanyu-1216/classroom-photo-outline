<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大纲预览与校对 · 课堂大纲</title>
  <link rel="stylesheet" href="/css/home.css?v=20261020-service-check">
  <link rel="stylesheet" href="/css/outline.css">
  <link rel="stylesheet" href="/css/book.css?v=20261025-paper">
  <script src="/js/page-transition.js"></script>
</head>
<body id="knowledge-flow-home" class="kf-book-skin kf-outline-page">
  <header class="kf-header">
    <div class="kf-brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z"/><path d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1"/></svg><span>课堂大纲</span></div>
    <nav class="kf-nav" aria-label="主导航">
      <a class="kf-nav-item" href="/">新建整理</a>
      <a class="kf-nav-item kf-current" href="/history.html" aria-current="location">整理记录</a>
    </nav>
    <div class="kf-motion-controls">
      <button class="kf-speed-toggle" type="button" aria-expanded="false" aria-controls="kf-speed-panel">速度 1×</button>
      <div class="kf-speed-panel" id="kf-speed-panel" hidden>
        <label for="kf-speed">流动速度 <output class="kf-speed-value" for="kf-speed">1×</output></label>
        <input class="kf-speed-input" id="kf-speed" type="range" min="0.25" max="3" step="0.25" value="1">
        <div class="kf-speed-hints"><span>舒缓</span><span>轻快</span></div>
      </div>
    </div>
  </header>
  <main class="kf-main">
    <section class="outline-section" aria-labelledby="outline-heading">
      <div class="kf-heading">
        <h1 id="outline-heading">大纲预览与校对</h1>
        <p>核对课堂内容与来源，保存后导出 Word。</p>
      </div>
      <div class="kf-workspace kf-outline-workspace">
        <p id="outline-status" class="error hidden" role="alert"></p>
        <p id="outline-quality" class="kf-quality-notice hidden" role="status"></p>
        <p id="outline-mode" class="kf-quality-notice" role="status"></p>
        <div class="kf-outline-tools">
          <div class="toolbar">
            <a id="outline-back-link" class="btn btn-secondary" href="/history.html">← 返回整理记录</a>
            <button id="edit-btn" class="btn btn-secondary" type="button">编辑</button>
            <button id="save-btn" class="btn btn-primary hidden" type="button">保存</button>
            <button id="cancel-edit-btn" class="btn btn-secondary hidden" type="button">取消</button>
            <button id="regenerate-btn" class="btn btn-warning" type="button">重新生成</button>
            <button id="export-btn" class="btn btn-primary" type="button">导出 Word</button>
            <a id="evaluation-link" class="btn btn-secondary" href="#">效果评价与证据</a>
          </div>
          <div class="outline-recovery">
            <button id="outline-retry-btn" class="btn btn-secondary hidden" type="button">重新加载大纲</button>
            <a id="outline-progress-link" href="#">查看任务处理状态</a>
          </div>
        </div>
        <div id="outline-view" class="outline-view"></div>
        <textarea id="outline-editor" class="outline-editor hidden" rows="24" aria-label="编辑课堂大纲"></textarea>
        <div class="legend">
          <span class="legend-item"><span class="dot dot-original" aria-hidden="true"></span>课堂原话</span>
          <span class="legend-item"><span class="dot dot-ai" aria-hidden="true"></span>AI生成：课外拓展；AI推断：课堂题目解答等推演</span>
          <span class="legend-item">关联课堂页：拓展主题的依据，不代表课件原文</span>
          <span class="legend-item">来源待核对：原记录未提供来源类型</span>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js?v=20261020-service-check"></script>
  <script src="/js/outline.js?v=20261021-knowledge-expansion"></script>
  <script src="/js/book-source-map.js?v=20261025-paper"></script>
  <script src="/js/book-ui.js?v=20261025-paper"></script>
</body>
</html>
