<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课堂PPT照片智能大纲生成器</title>
  <link rel="stylesheet" href="/css/home.css?v=20261020-service-check">
  <link rel="stylesheet" href="/css/history.css">
  <link rel="stylesheet" href="/css/book.css?v=20261025-paper">
  <script src="/js/page-transition.js"></script>
</head>
<body id="knowledge-flow-home" class="kf-book-skin">
  <header class="kf-header">
    <div class="kf-brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z"/><path d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1"/></svg><span>课堂大纲</span></div>
    <nav class="kf-nav" aria-label="主导航">
      <a class="kf-nav-item kf-current" href="/" aria-current="page">新建整理</a>
      <a class="kf-nav-item" href="/history.html">整理记录</a>
    </nav>
    <div class="kf-motion-controls">
      <button class="kf-speed-toggle" type="button" aria-expanded="false" aria-controls="kf-speed-panel">速度 1×</button>
      <div class="kf-speed-panel" id="kf-speed-panel" hidden>
        <label for="kf-speed">流动速度 <output class="kf-speed-value" for="kf-speed">1×</output></label>
        <input class="kf-speed-input" id="kf-speed" type="range" min="0.25" max="3" step="0.25" value="1">
        <div class="kf-speed-hints"><span>舒缓</span><span>轻快</span></div>
      </div>
    </div>
  </header>
  <main class="kf-main">
    <section class="kf-upload-page" aria-labelledby="upload-heading">
      <div class="kf-heading">
        <h1 id="upload-heading">从几张照片，开始整理。</h1>
        <p>把课堂上的片刻，变成可以反复阅读的知识。</p>
      </div>
      <div class="kf-workspace">
        <div class="kf-section-head"><h2>课堂照片</h2><span id="file-formats">JPG / PNG</span></div>
        <div class="kf-model-info"><p id="model-status" role="status" aria-live="polite">正在检查识别服务…</p><p id="model-budget-note"></p><button id="model-retry" type="button" hidden>重新检查服务</button></div>
        <label id="drop-zone" class="kf-drop">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <strong>添加课堂照片</strong>
          <span>将照片拖到这里，或选择文件</span>
          <span class="kf-file-button">选择文件</span>
          <small id="file-hint">最多 20 张，单张不超过 10 MB</small>
          <input id="file-input" class="kf-file-input" type="file" multiple accept=".jpg,.jpeg,.png,.pdf" aria-label="选择课堂照片" aria-describedby="file-hint">
        </label>
        <div class="kf-list-header"><span>照片列表</span><span id="file-count" class="kf-file-count" aria-live="polite">0 张</span></div>
        <div id="file-list" class="kf-files"><p class="kf-empty">还没有添加照片</p></div>
        <p id="upload-message" class="kf-upload-message" role="status" aria-live="polite"></p>
        <div class="kf-bottom">
          <span>照片顺序将作为来源页码。</span>
          <button id="generate-btn" class="kf-generate" type="button" disabled>生成大纲</button>
        </div>
      </div>
      <p class="kf-note">生成后可继续校对，并导出 Word。AI 生成结果仅供参考，请人工校对后使用。</p>
      <p id="workspace-status" class="kf-workspace-notice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js?v=20261020-service-check"></script>
  <script src="/js/upload.js?v=20261020-service-check"></script>
  <script src="/js/history.js"></script>
  <script src="/js/book-source-map.js?v=20261025-paper"></script>
  <script src="/js/book-ui.js?v=20261025-paper"></script>
  <script src="/js/workspace.js"></script>
</body>
</html>
