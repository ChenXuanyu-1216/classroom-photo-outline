<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>处理进度 · 课堂大纲</title>
  <link rel="stylesheet" href="/css/home.css?v=20261020-service-check">
  <link rel="stylesheet" href="/css/outline.css">
  <link rel="stylesheet" href="/css/progress.css">
  <link rel="stylesheet" href="/css/book.css?v=20261025-paper">
  <script src="/js/page-transition.js"></script>
</head>
<body id="knowledge-flow-home" class="kf-book-skin kf-outline-page kf-progress-page">
  <header class="kf-header">
    <div class="kf-brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z"/><path d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1"/></svg><span>课堂大纲</span></div>
    <nav class="kf-nav" aria-label="主导航">
      <a class="kf-nav-item" href="/">新建整理</a>
      <a class="kf-nav-item kf-current" href="/history.html" aria-current="location">整理记录</a>
    </nav>
    <div class="kf-motion-controls">
      <button class="kf-speed-toggle" type="button" aria-expanded="false" aria-controls="kf-speed-panel">速度 1×</button>
      <div class="kf-speed-panel" id="kf-speed-panel" hidden>
        <label for="kf-speed">流动速度 <output class="kf-speed-value" for="kf-speed">1×</output></label>
        <input class="kf-speed-input" id="kf-speed" type="range" min="0.25" max="3" step="0.25" value="1">
        <div class="kf-speed-hints"><span>舒缓</span><span>轻快</span></div>
      </div>
    </div>
  </header>
  <main class="kf-main">
        <section class="progress-section">
            <div class="kf-heading"><h1 id="progress-title">正在读取任务</h1>
            <p id="progress-message" role="status" aria-live="polite">正在检查已保存的处理结果。</p></div>
            <div class="kf-workspace kf-progress-workspace">
            <div class="progress-steps">
                <div class="step" id="step-recognize">
                    <span class="step-icon">1</span>
                    <span class="step-name">内容识别</span>
                    <span class="step-status">等待中</span>
                </div>
                <div class="step" id="step-extract">
                    <span class="step-icon">2</span>
                    <span class="step-name">知识点抽取</span>
                    <span class="step-status">等待中</span>
                </div>
                <div class="step" id="step-cluster">
                    <span class="step-icon">3</span>
                    <span class="step-name">聚类重组</span>
                    <span class="step-status">等待中</span>
                </div>
                <div class="step" id="step-generate">
                    <span class="step-icon">4</span>
                    <span class="step-name">大纲生成</span>
                    <span class="step-status">等待中</span>
                </div>
            </div>
            <div id="page-details" class="page-details"></div>
            <div id="progress-error" class="error hidden" role="alert">
                <p id="progress-error-message"></p>
            </div>
            <div id="low-confidence-warning" class="warning hidden">
                <p>以下页面有内容需要对照原图核对：</p>
                <ul id="low-confidence-pages"></ul>
            </div>
            <div id="failed-pages" class="error hidden">
                <p>以下页面识别失败：</p>
                <ul id="failed-page-list"></ul>
            </div>
            <div class="actions">
                <button id="retry-btn" class="btn btn-warning hidden">重试失败页</button>
                <button id="continue-btn" class="btn btn-secondary hidden">重新检查并继续</button>
                <a id="view-outline" class="btn btn-primary hidden" href="#">查看大纲</a>
                <a id="evaluation-link" class="btn btn-secondary" href="#">查看效果与错误证据</a>
            </div>
            </div>
        </section>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js?v=20261020-service-check"></script>
  <script src="/js/progress.js?v=20261025-model-network"></script>
  <script src="/js/book-source-map.js?v=20261025-paper"></script>
  <script src="/js/book-ui.js?v=20261025-paper"></script>
</body>
</html>
